info:
  name: CreateOrder
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}api/order"
  body:
    type: json
    data: |-
      {
        "gameIds": [
          "{{GameId}}"
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();

        bru.setEnvVar("OrderId", response.orderId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
