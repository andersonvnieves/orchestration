info:
  name: Decline
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}api/payment/decline?orderId={{OrderId}}"
  params:
    - name: orderId
      value: "{{OrderId}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
