info:
  name: Approve
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}api/payment/approve?orderId={{OrderId}}"
  params:
    - name: orderId
      value: "{{OrderId}}"
      type: query
  auth: inherit

runtime:
  variables:
    - name: OrderId
      value: 265d65eb-8a25-4cc8-9301-b3d97a390c86

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
