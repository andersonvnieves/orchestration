info:
  name: Login as admin
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseURL}}api/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "admin@fgc.com",
        "password": "Admin@123"
      }
  auth: inherit

runtime:
  variables:
    - name: baseURL
      value: https://localhost:8443/
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();

        bru.setEnvVar("accessToken", response.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
