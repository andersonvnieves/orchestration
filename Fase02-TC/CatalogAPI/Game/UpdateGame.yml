info:
  name: UpdateGame
  type: http
  seq: 3

http:
  method: PUT
  url: "{{CatalogBaseURL}}api/Game"
  body:
    type: json
    data: |-
      {
        "id": "{{GameId}}",
        "title": "Horizon Zero Dawn 2",
        "description": "string",
        "story": "string",
        "price": 100,
        "franchise": "Horizon Zero Dawn",
        "releaseDate": "2026-06-26",
        "ageRating": "A16",
        "gameModes": [
          "SinglePlayer"
        ],
        "publisher": "Playstatin Studios",
        "developers": [
          "Guerrilla"
        ]
      }
  auth: inherit

runtime:
  variables:
    - name: GameId
      value: "23"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
