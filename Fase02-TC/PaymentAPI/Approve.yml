info:
  name: Approve
  type: http
  seq: 1

http:
  method: POST
  url: "{{PaymentBaseURL}}api/payment/approve?orderId={{OrderId}}"
  params:
    - name: orderId
      value: "{{OrderId}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
