        url: http://catalog-api-service.fgc.svc.cluster.local:80
        routes:
          - name: catalog-game-route
            paths:
              - /api/game
            strip_path: false
            protocols: [https]
          - name: catalog-library-route
            paths:
              - /api/library
            strip_path: false
            protocols: [https]
            plugins:
              - name: jwt
                config:
                  uri_param_names: [jwt]
                  claims_to_verify: [exp]
          - name: catalog-order-route
            paths:
              - /api/order
            strip_path: false
            protocols: [https]
            plugins:
              - name: jwt
