            paths:
              - /api/payment/approve
            strip_path: false
            protocols: [https]
            plugins:
              - name: jwt
                config:
                  uri_param_names: [jwt]
                  claims_to_verify: [exp]
          - name: payment-decline-route
            paths:
              - /api/payment/decline
            strip_path: false
            protocols: [https]
            plugins:
              - name: jwt
                config:
                  uri_param_names: [jwt]
                  claims_to_verify: [exp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-gateway
  namespace: fgc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong-gateway
  template:
    metadata:
      labels:
        app: kong-gateway
    spec:
      containers:
        - name: kong
          image: kong/kong-gateway:latest
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: "/etc/kong/kong.yml"
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8080, 0.0.0.0:8443 ssl"
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:9001"
            - name: KONG_PROXY_ACCESS_LOG
              value: "/dev/stdout"
            - name: KONG_ADMIN_ACCESS_LOG
              value: "/dev/stdout"
          ports:
            - containerPort: 8080
              name: proxy
            - containerPort: 8443
              name: proxy-ssl
            - containerPort: 9001
              name: admin
          volumeMounts:
            - name: config-volume
              mountPath: /etc/kong
      volumes:
        - name: config-volume
          configMap:
            name: kong-declarative-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy-service
  namespace: fgc
spec:
  type: LoadBalancer
  selector:
    app: kong-gateway
  ports:
    - name: proxy
      port: 80
      targetPort: 8080
      nodePort: 30085
    - name: proxy-https
      port: 443
      targetPort: 8443
      nodePort: 30443
    - name: admin
      port: 9001
      targetPort: 9001
