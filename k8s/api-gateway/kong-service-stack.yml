apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kong-declarative-config
  namespace: fgc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: kong-declarative-config
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        kong.yml: |
          _format_version: "3.0"
          certificates:
            - id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
              cert: |
                {{- .ssl_cert | replace "\\n" "\n" | nindent 16 }}
              key: |
                {{- .ssl_key | replace "\\n" "\n" | nindent 16 }}

          snis:
            - id: f9e8d7c6-b5a4-3210-fedc-ba9876543210
              name: fgc.local
              certificate:
                id: a1b2c3d4-e5f6-7890-abcd-ef1234567890

          consumers:
            - username: fgc-api-client
              jwt_secrets:
                - key: fgcapi
                  secret: "{{ .jwt_secret }}"
                  algorithm: HS256

          services:
            - name: catalog-service
              url: http://catalog-api-service.fgc.svc.cluster.local:80
              routes:
                - name: catalog-game-route
                  paths:
                    - /api/game
                  strip_path: false
                  protocols: [https]
                - name: catalog-library-route
                  paths:
                    - /api/library
                  strip_path: false
                  protocols: [https]
                  plugins:
                    - name: jwt
                      config:
                        header_names: [authorization]
                        claims_to_verify: [exp]
                - name: catalog-order-route
                  paths:
                    - /api/order
                  strip_path: false
                  protocols: [https]
                  plugins:
                    - name: jwt
                      config:
                        header_names: [authorization]
                        claims_to_verify: [exp]

            - name: users-service
              url: http://users-api-service.fgc.svc.cluster.local:80
              routes:
                - name: user-role-route
                  paths:
                    - /api/user/role
                  strip_path: false
                  protocols: [https]
                  plugins:
                    - name: jwt
                      config:
                        header_names: [authorization]
                        claims_to_verify: [exp]
                - name: user-register-get-route
                  paths:
                    - /api/user
                  strip_path: false
                  protocols: [https]

            - name: auth-service
              url: http://users-api-service.fgc.svc.cluster.local:80
              routes:
                - name: auth-login-route
                  paths:
                    - /api/auth/login
                  strip_path: false
                  protocols: [https]

            - name: payment-service
              url: http://payment-api-service.fgc.svc.cluster.local:80
              routes:
                - name: payment-approve-route
                  paths:
                    - /api/payment/approve
                  strip_path: false
                  protocols: [https]
                  plugins:
                    - name: jwt
                      config:
                        header_names: [authorization]
                        claims_to_verify: [exp]
                - name: payment-decline-route
                  paths:
                    - /api/payment/decline
                  strip_path: false
                  protocols: [https]
                  plugins:
                    - name: jwt
                      config:
                        header_names: [authorization]
                        claims_to_verify: [exp]
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: /fgc/jwt/secret
    - secretKey: ssl_cert
      remoteRef:
        key: /fgc/kong/ssl-cert
    - secretKey: ssl_key
      remoteRef:
        key: /fgc/kong/ssl-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-gateway
  namespace: fgc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong-gateway
  template:
    metadata:
      labels:
        app: kong-gateway
    spec:
      containers:
        - name: kong
          image: kong/kong-gateway:latest
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: "/etc/kong/kong.yml"
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8080, 0.0.0.0:8443 ssl"
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:9001"
            - name: KONG_PROXY_ACCESS_LOG
              value: "/dev/stdout"
            - name: KONG_ADMIN_ACCESS_LOG
              value: "/dev/stdout"
          ports:
            - containerPort: 8080
              name: proxy
            - containerPort: 8443
              name: proxy-ssl
            - containerPort: 9001
              name: admin
          volumeMounts:
            - name: config-volume
              mountPath: /etc/kong
      volumes:
        - name: config-volume
          secret:
            secretName: kong-declarative-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy-service
  namespace: fgc
spec:
  type: LoadBalancer
  selector:
    app: kong-gateway
  ports:
    - name: proxy
      port: 80
      targetPort: 8080
    - name: proxy-https
      port: 443
      targetPort: 8443
