AWSTemplateFormatVersion: '2010-09-09'
Description: 'Template CloudFormation FGC - Amazon MQ (RabbitMQ engine)'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: 'ID do VPC onde as instancias serao implantadas'
  SubnetId:
    Type: List<AWS::EC2::Subnet::Id>
    Description: 'ID da Subnet'
  RabbitUser:
    Type: String
    Description: Master username for RabbitMQ
  RabbitPassword:
    Type: String
    Description: Master password for RabbitMQ
    NoEcho: true

Resources:
  RabbitMQBroker:
    Type: AWS::AmazonMQ::Broker
    Properties:
      BrokerName: fgc-rabbitmq-broker
      EngineType: RabbitMQ
      EngineVersion: "4.3"
      HostInstanceType: mq.m7g.large
      DeploymentMode: SINGLE_INSTANCE
      PubliclyAccessible: true
      SubnetIds: !Ref SubnetId
      Users:
        - Username: !Ref RabbitUser
          Password: !Ref RabbitPassword

Outputs:
  RabbitMQBrokerId:
    Description: ID of the Amazon MQ RabbitMQ broker
    Value: !Ref RabbitMQBroker
    Export:
      Name: !Sub "${AWS::StackName}-RabbitMQBrokerId"
  RabbitMQEndpoints:
    Description: Endpoints (AMQP) for the broker
    Value: !GetAtt RabbitMQBroker.AmqpEndpoints
    Export:
      Name: !Sub "${AWS::StackName}-RabbitMQEndpoints"
  RabbitMQConsoleUrl:
    Description: URL for the RabbitMQ Management Console (Web UI)
    Value: !GetAtt RabbitMQBroker.ConsoleUrl
    Export:
      Name: !Sub "${AWS::StackName}-RabbitMQConsoleUrl"
