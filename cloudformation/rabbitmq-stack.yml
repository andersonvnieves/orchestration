AWSTemplateFormatVersion: '2010-09-09'
Description: 'Template CloudFormation FGC - Amazon MQ (RabbitMQ engine)'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: 'ID do VPC onde as instancias serao implantadas'
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: 'ID da Subnet (obrigatorio ser apenas uma para SINGLE_INSTANCE)'
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: 'Security group'
  RabbitUser:
    Type: String
    Description: Master username for RabbitMQ
  RabbitPassword:
    Type: String
    Description: Master password for RabbitMQ
    NoEcho: true

Resources:
  RabbitMQBroker:
    Type: AWS::AmazonMQ::Broker
    Properties:
      BrokerName: fgc-rabbitmq-broker
      EngineType: RabbitMQ
      EngineVersion: "3.13"
      HostInstanceType: mq.m5.large
      DeploymentMode: SINGLE_INSTANCE
      PubliclyAccessible: false
      SubnetIds:
        - !Ref SubnetId
      SecurityGroups:
        - !Ref SecurityGroupId
      Users:
        - Username: !Ref RabbitUser
          Password: !Ref RabbitPassword

  RabbitMQSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SecurityGroupId
      IpProtocol: tcp
      FromPort: 5671
      ToPort: 5671
      CidrIp: 172.31.0.0/16
