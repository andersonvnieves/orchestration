AWSTemplateFormatVersion: '2010-09-09'
Description: 'Template CloudFormation FGC - ElastiCache'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: 'ID do VPC onde as instancias serao implantadas'
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: 'Lista de IDs de pelo menos 2 Subnets (em zonas de disponibilidade diferentes)'
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: 'Security group'

Resources:
  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Subnet group for Redis cache
      SubnetIds: !Ref SubnetIds

  RedisCache:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      ClusterName: fgc-redis
      Engine: redis
      EngineVersion: "7.0"
      CacheNodeType: cache.t3.micro
      NumCacheNodes: 1
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      VpcSecurityGroupIds:
        - !Ref SecurityGroupId
      Port: 6379
      AutoMinorVersionUpgrade: true

Outputs:
  RedisEndpoint:
    Description: Endpoint of Redis
    Value: !GetAtt RedisCache.RedisEndpoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-RedisEndpoint"
