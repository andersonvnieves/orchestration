AWSTemplateFormatVersion: '2010-09-09'
Description: 'Template CloudFormation FGC - RDS'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: 'ID do VPC onde as instancias serao implantadas'
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: 'Lista de IDs de pelo menos 2 Subnets (em zonas de disponibilidade diferentes)'
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: 'Security group'
  DBPassword:
    Type: String
    Description: 'Master password for all SQL Server databases'
    NoEcho: true

Resources:
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group para RDS instance
      SubnetIds: !Ref SubnetIds
      Tags:
        - Key: Name
          Value: fgc-rds-subnet-group

  DBSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SecurityGroupId
      IpProtocol: tcp
      FromPort: 1433
      ToPort: 1433
      CidrIp: 172.31.0.0/16

  FGCDBInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: fgc-db
      Engine: sqlserver-ex
      EngineVersion: "15.00"
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp2
      MasterUsername: sa
      MasterUserPassword: !Ref DBPassword
      VPCSecurityGroups:
        - !Ref SecurityGroupId
      DBSubnetGroupName: !Ref DBSubnetGroup
      MultiAZ: false
      PubliclyAccessible: true
      BackupRetentionPeriod: 7
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: fgc-db
